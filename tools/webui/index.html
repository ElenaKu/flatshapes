<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>flatshapes test bench</title>
<style>
  :root { --bg:#16171a; --panel:#1f2024; --line:#33353b; --text:#e6e6e6; --dim:#9a9ca3; --acc:#e0b04c;
          --ok:#4cd07d; --bad:#ff5a5a; --circle:#00e5ff; --ellipse:#3d7bff; --polygon:#22c55e; --star:#ff3df2; --line-k:#ff9a1f; --motif:#ffe14d; --model:#ffffff; --sym:#7dffb0; --ring:#c8ffc8; --segment:#00ffc8; --teardrop:#7ab4ff; --heart:#ff5078; --crescent:#ffe600; }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--text); height:100vh;
         display:grid; grid-template-columns:240px 1fr 330px; grid-template-rows:auto 1fr; }
  header { grid-column:1/4; display:flex; gap:14px; align-items:center; padding:6px 10px; background:var(--panel);
           border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header b { color:var(--acc); }
  aside, #right { background:var(--panel); overflow:auto; }
  aside { border-right:1px solid var(--line); }
  #right { border-left:1px solid var(--line); }
  .tabs { display:flex; flex-wrap:wrap; gap:2px; }
  .tab { padding:4px 9px; border:1px solid var(--line); background:#26272c; color:var(--dim); cursor:pointer;
         border-radius:4px; user-select:none; }
  .tab.on { background:var(--acc); color:#111; border-color:var(--acc); }
  .tab.kind.on { color:#111; }
  #files input { width:100%; margin:0; padding:6px; background:#121316; color:var(--text); border:0;
                 border-bottom:1px solid var(--line); }
  .file { padding:4px 8px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--dim); }
  .file:hover { background:#2a2b30; }
  .file.on { background:#3a3220; color:var(--text); }
  .file .v { float:right; color:var(--ok); font-size:11px; }
  #view { position:relative; overflow:hidden; background:#0c0c0e; }
  #view svg { width:100%; height:100%; display:block; cursor:crosshair; }
  #busy { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:#0006;
          pointer-events:none; flex-direction:column; gap:10px; color:var(--text); }
  #busy.on { display:flex; }
  .spin { width:46px; height:46px; border:4px solid #ffffff22; border-top-color:var(--acc); border-radius:50%;
          animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #toast { position:absolute; right:10px; top:10px; background:#000c; border:1px solid var(--acc); color:var(--text);
           padding:6px 10px; border-radius:4px; opacity:0; transition:opacity .3s; pointer-events:none; max-width:60%; }
  #toast.on { opacity:1; }
  #status { left:8px; bottom:6px; color:var(--dim); background:#000a; padding:2px 6px; border-radius:3px; }
  section { padding:8px 10px; border-bottom:1px solid var(--line); }
  h3 { margin:0 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); }
  .row { display:grid; grid-template-columns:110px 1fr 46px; gap:6px; align-items:center; margin:3px 0; }
  .row input[type=range] { width:100%; }
  .row span { text-align:right; font-variant-numeric:tabular-nums; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  td, th { padding:2px 4px; border-bottom:1px solid #2a2b30; text-align:left; font-variant-numeric:tabular-nums; }
  .pass { color:var(--ok); } .fail { color:var(--bad); }
  .btn { padding:5px 10px; border:1px solid var(--line); background:#2a2b30; color:var(--text); border-radius:4px; cursor:pointer; }
  .btn.ok { border-color:var(--ok); color:var(--ok); } .btn.bad { border-color:var(--bad); color:var(--bad); }
  .muted { color:var(--dim); }
  kbd { background:#2a2b30; border:1px solid var(--line); border-radius:3px; padding:0 4px; font-size:11px; }
  .pane { flex:1; display:flex; flex-direction:column; min-width:0; }
  .pane .cap { padding:2px 4px; }
  .pane img, #geoOut svg { flex:1; width:100%; min-height:0; object-fit:contain; display:block; }
  #geoOut { flex:1; display:flex; min-height:0; }
  #fb { position:fixed; inset:0; background:#000a; display:none; align-items:center; justify-content:center; z-index:10; }
  #fb.on { display:flex; }
  #fbBox { width:min(760px, 92vw); height:min(640px, 88vh); background:var(--panel); border:1px solid var(--line);
           border-radius:8px; display:flex; flex-direction:column; }
  #fbBox .top { padding:10px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:8px; }
  #fbPath { width:100%; padding:6px 8px; background:#121316; color:var(--text); border:1px solid var(--line); border-radius:4px; font:13px monospace; }
  #fbList { flex:1; overflow:auto; padding:4px 0; }
  .dir { padding:6px 12px; cursor:pointer; display:flex; gap:8px; }
  .dir:hover { background:#2a2b30; }
  #fbBox .bottom { padding:10px; border-top:1px solid var(--line); display:flex; gap:10px; align-items:center; }
  .crumb { cursor:pointer; color:var(--acc); } .crumb:hover { text-decoration:underline; }
  .btn.main { background:var(--acc); color:#111; border-color:var(--acc); font-weight:600; }
  #files .head { padding:6px 8px; border-bottom:1px solid var(--line); display:flex; gap:6px; align-items:center; }
  #rootName { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--dim); direction:rtl; text-align:left; }
  .sw { display:inline-block; width:10px; height:10px; border-radius:2px; vertical-align:middle; margin-right:4px; }
</style>
</head>
<body>
<header>
  <b>flatshapes</b>
  <div class="tabs" id="appTabs"></div>
  <span id="shapeHeader" style="display:contents">
  <div class="tabs" id="modeTabs"></div>
  <div class="tabs" id="missedTabs" style="display:none"></div>
  <span class="muted">Model:</span>
  <div class="tabs" id="modelTabs"></div>
  <span class="muted">Show:</span>
  <div class="tabs" id="kindTabs"></div>
  <span class="muted" id="counts"></span>
  </span>
  <span style="flex:1"></span>
  <span class="muted"><kbd>C</kbd> correct <kbd>X</kbd> wrong <kbd>Del</kbd> clear <kbd>←</kbd><kbd>→</kbd> image <kbd>F</kbd> fit</span>
</header>
<aside id="files"><div class="head"><button class="btn" id="bFolder" title="Choose image folder">📁 Folder</button><span id="rootName"></span></div>
<input id="filter" placeholder="filter files…"><div id="fileList"></div></aside>
<div id="fb"><div id="fbBox">
  <div class="top">
    <div style="display:flex;gap:8px;align-items:center"><b>Choose image folder</b><span style="flex:1"></span><button class="btn" id="fbClose">✕</button></div>
    <div class="tabs" id="fbDrives"></div>
    <input id="fbPath" spellcheck="false" placeholder="type or paste a folder path and press Enter">
    <div id="fbCrumbs" class="muted"></div>
  </div>
  <div id="fbList"></div>
  <div class="bottom"><span id="fbInfo" class="muted" style="flex:1"></span>
    <button class="btn main" id="fbOpen">Open this folder</button></div>
</div></div>
<div id="geoView" style="display:none;overflow:hidden;background:#0c0c0e;position:relative">
  <div style="display:flex;height:100%;gap:6px;padding:6px">
    <div class="pane"><div class="muted cap">original</div><img id="geoOrig"></div>
    <div class="pane"><div class="muted cap" id="geoCap">shapes</div><div id="geoOut"></div></div>
  </div>
  <div id="geoBusy" class="muted" style="position:absolute;left:10px;bottom:8px"></div>
</div>
<div id="view"><svg id="svg"></svg><div id="busy"><div class="spin"></div><div id="busyText">processing…</div></div><div id="toast"></div><div id="status">loading…</div></div>
<div id="right">
  <section><div class="tabs" id="panelTabs"></div></section>
  <div id="panelSettings"></div>
  <div id="panelInspector" style="display:none"></div>
  <div id="panelVerdicts" style="display:none"></div>
  <div id="panelGeo" style="display:none"></div>
</div>
<script>
const KINDS = ["circle", "ellipse", "polygon", "star", "ring", "segment", "teardrop", "heart", "crescent", "line", "motif", "model"];
const SHAPE_KINDS = ["circle", "ellipse", "polygon", "star", "ring", "segment", "teardrop", "heart", "crescent", "line"];
const KCOL = k => getComputedStyle(document.documentElement).getPropertyValue(k === "line" ? "--line-k" : "--" + k).trim();
// slider definitions: [key, label, min, max, step, default]
const SETTINGS = {
  general: [["colors", "colours (k-means)", 2, 16, 1, 8], ["merge_de", "merge colours ΔE", 0, 30, 1, 10],
            ["min_area", "min area px", 5, 500, 5, 60], ["rim", "rim ignore px", 0, 10, 1, 4], ["underlay", "underlay share ≥", 0.1, 1, 0.05, 0.5],
            ["slack", "model slack px", 0, 1, 0.05, 0.15]],
  circle:  [["max_mean", "mean ≤ px", 0.1, 2, 0.05, 0.45], ["max_p80", "p80 ≤ px", 0.2, 3, 0.05, 0.9],
            ["min_r", "min radius px", 1, 30, 0.5, 3], ["max_gap_deg", "max gap °", 60, 360, 5, 200],
            ["min_visible", "min visible", 0, 1, 0.05, 0.3], ["rel_mean", "size slack mean", 0, 0.06, 0.002, 0.022], ["rel_p80", "size slack p80", 0, 0.08, 0.002, 0.035]],
  ellipse: [["max_mean", "mean ≤ px", 0.1, 2, 0.05, 0.5], ["max_p80", "p80 ≤ px", 0.2, 3, 0.05, 1.0],
            ["max_aspect", "max axis ratio", 1, 20, 0.5, 6], ["max_gap_deg", "max gap °", 60, 360, 5, 200],
            ["min_visible", "min visible", 0, 1, 0.05, 0.4], ["rel_mean", "size slack mean", 0, 0.06, 0.002, 0.022], ["rel_p80", "size slack p80", 0, 0.08, 0.002, 0.035]],
  polygon: [["max_mean", "mean ≤ px", 0.1, 2, 0.05, 0.8], ["max_p80", "p80 ≤ px", 0.2, 3, 0.05, 1.3],
            ["max_sides", "max sides", 3, 16, 1, 12], ["eps_rel", "corner eps (rel)", 0.005, 0.06, 0.005, 0.02],
            ["min_side", "min side px", 1, 30, 1, 4], ["shallow_turn", "curve guard °", 0, 60, 1, 25], ["rel_mean", "size slack mean", 0, 0.06, 0.002, 0.022], ["rel_p80", "size slack p80", 0, 0.08, 0.002, 0.035]],
  star:    [["max_mean", "mean ≤ px", 0.1, 2, 0.05, 0.7], ["max_p80", "p80 ≤ px", 0.2, 3, 0.05, 1.5],
            ["max_area_err", "area err ≤", 0.01, 0.3, 0.01, 0.06], ["min_ratio", "tip / inner r ≥", 1, 3, 0.05, 1.5], ["rel_mean", "size slack mean", 0, 0.06, 0.002, 0.022], ["rel_p80", "size slack p80", 0, 0.08, 0.002, 0.035]],
  ring:    [["max_mean", "mean ≤ px", 0.1, 2, 0.05, 0.5], ["max_p80", "p80 ≤ px", 0.2, 3, 0.05, 1.0],
            ["min_hole", "min hole share", 0.01, 0.5, 0.01, 0.05], ["max_offset", "max centre offset", 0, 0.3, 0.01, 0.08]],
  segment: [["max_mean", "mean ≤ px", 0.1, 2, 0.05, 0.5], ["max_p80", "p80 ≤ px", 0.2, 3, 0.05, 1.0]],
  teardrop:[["max_mean", "mean ≤ px", 0.1, 2, 0.05, 0.5], ["max_p80", "p80 ≤ px", 0.2, 3, 0.05, 1.0]],
  heart:   [["max_mean", "mean ≤ px", 0.1, 2, 0.05, 0.6], ["max_p80", "p80 ≤ px", 0.2, 3, 0.05, 1.2]],
  crescent:[["max_mean", "mean ≤ px", 0.1, 2, 0.05, 0.5], ["max_p80", "p80 ≤ px", 0.2, 3, 0.05, 1.0]],
  line:    [["min_len", "min length px", 5, 200, 1, 20], ["max_width", "max width px", 1, 30, 0.5, 9],
            ["body_r", "body radius px", 1, 12, 0.5, 4], ["max_angle", "join angle °", 0, 15, 0.5, 4],
            ["max_offset", "join offset px", 0, 8, 0.5, 2], ["max_gap", "join gap px", 0, 300, 5, 90]],
  motif:   [["min_iou", "overlay IoU ≥", 0.5, 1, 0.01, 0.85], ["sig_tol", "signature tol", 0.01, 0.3, 0.01, 0.08],
            ["same_colour", "same colour (0/1)", 0, 1, 1, 1], ["allow_scale", "allow scale (0/1)", 0, 1, 1, 1],
            ["allow_mirror", "allow mirror (0/1)", 0, 1, 1, 1], ["split", "split stuck copies (0/1)", 0, 1, 1, 1],
            ["split_cover", "split: cover ≥", 0.5, 1, 0.01, 0.85], ["split_edge", "split: on outline ≥", 0.3, 1, 0.01, 0.65]],
  symmetry:[["rot_iou", "rotation IoU ≥", 0.5, 1, 0.01, 0.9], ["mirror_iou", "mirror IoU ≥", 0.5, 1, 0.01, 0.9]],
};
const S = { images: [], cur: -1, data: null, sel: null, verd: { marks: [], missed: [] }, mode: "inspect",
            missedKind: "circle", show: Object.fromEntries(KINDS.map(k => [k, true])), panel: "settings",
            group: "general", vb: null, inspect: null,
            values: {}, enabled: Object.fromEntries(KINDS.map(k => [k, true])), useModel: true };
S.show.model = false;
S.app = "shapes";
S.geo = { shapes: 3, kinds: ["circle", "ellipse", "rect", "roundrect", "triangle", "capsule"], lines: true, min_area: 40, svg: null };
try { Object.assign(S.geo, JSON.parse(localStorage.getItem("fs_geo") || "{}"), { svg: null }); } catch (e) {}
const GEO_KINDS = ["circle", "ellipse", "rect", "roundrect", "triangle", "capsule"];
function drawApp() {
  tabs($("appTabs"), [["shapes", "Find shapes"], ["geo", "Geometrize"]], k => S.app === k, k => { S.app = k; drawApp(); });
  const geo = S.app === "geo";
  $("shapeHeader").style.display = geo ? "none" : "contents";
  $("view").style.display = geo ? "none" : "";
  $("geoView").style.display = geo ? "" : "none";
  $("panelTabs").parentElement.style.display = geo ? "none" : "";
  for (const id of ["panelSettings", "panelInspector", "panelVerdicts"]) if (geo) $(id).style.display = "none";
  $("panelGeo").style.display = geo ? "" : "none";
  if (geo) { drawGeoPanel(); geometrize(); } else { drawPanels(); if (S.cur >= 0 && !S.data) openImage(S.cur); }
}
function drawGeoPanel() {
  const el = $("panelGeo"); el.innerHTML = "";
  const sec = document.createElement("section"); el.appendChild(sec);
  sec.innerHTML = `<h3>Geometrize</h3><div class="muted">Every object rebuilt from a few simple shapes in the image's own colours.</div>`;
  const row = document.createElement("div"); row.className = "row";
  row.innerHTML = `<label>shapes per object</label><input type="range" min="1" max="8" step="1" value="${S.geo.shapes}"><span>${S.geo.shapes}</span>`;
  const inp = row.querySelector("input"); inp.oninput = () => { row.querySelector("span").textContent = inp.value; S.geo.shapes = +inp.value; geoChanged(); };
  sec.appendChild(row);
  const row2 = document.createElement("div"); row2.className = "row";
  row2.innerHTML = `<label>skip objects under px</label><input type="range" min="0" max="400" step="10" value="${S.geo.min_area}"><span>${S.geo.min_area}</span>`;
  const inp2 = row2.querySelector("input"); inp2.oninput = () => { row2.querySelector("span").textContent = inp2.value; S.geo.min_area = +inp2.value; geoChanged(); };
  sec.appendChild(row2);
  const h = document.createElement("h3"); h.style.marginTop = "10px"; h.textContent = "shapes to use"; sec.appendChild(h);
  const kt = document.createElement("div"); kt.className = "tabs"; sec.appendChild(kt);
  tabs(kt, GEO_KINDS.map(k => [k, k]), k => S.geo.kinds.includes(k), k => {
    S.geo.kinds = S.geo.kinds.includes(k) ? S.geo.kinds.filter(x => x !== k) : [...S.geo.kinds, k];
    if (!S.geo.kinds.length) S.geo.kinds = [k];
    drawGeoPanel(); geoChanged(); });
  const pr = document.createElement("div"); pr.className = "tabs"; pr.style.marginTop = "6px"; sec.appendChild(pr);
  const presets = { all: GEO_KINDS, dots: ["circle"], blocks: ["rect"], angular: ["rect", "triangle"], soft: ["circle", "ellipse", "capsule", "roundrect"] };
  tabs(pr, Object.keys(presets).map(k => [k, "preset: " + k]), k => JSON.stringify([...presets[k]].sort()) === JSON.stringify([...S.geo.kinds].sort()),
       k => { S.geo.kinds = [...presets[k]]; drawGeoPanel(); geoChanged(); });
  const h2 = document.createElement("h3"); h2.style.marginTop = "10px"; h2.textContent = "thin straight strokes"; sec.appendChild(h2);
  const lt = document.createElement("div"); lt.className = "tabs"; sec.appendChild(lt);
  tabs(lt, [["on", "keep as lines"], ["off", "drop"]], k => (k === "on") === S.geo.lines, k => { S.geo.lines = k === "on"; drawGeoPanel(); geoChanged(); });
  const sec2 = document.createElement("section"); el.appendChild(sec2);
  sec2.innerHTML = `<div id="geoInfo" class="muted"></div><div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
    <button class="btn main" id="geoSave">Save SVG to folder</button><button class="btn" id="geoDl">Download SVG</button></div>
    <div class="muted" style="margin-top:6px">Saved next to the image folder in <b>flatshapes_geometrized</b> (same subfolders). Colours: General tab of Find shapes.</div>`;
  $("geoSave").onclick = async () => { if (!S.geo.svg) return;
    try { const r = await api("/api/geometrize/save", { path: S.images[S.cur], svg: S.geo.svg, suffix: `_geo${S.geo.shapes}` }); toast("saved " + r.saved); }
    catch (e) { toast("save failed: " + e.message); } };
  $("geoDl").onclick = () => { if (!S.geo.svg) return;
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([S.geo.svg], { type: "image/svg+xml" }));
    a.download = (S.images[S.cur] || "image").split(/[\\/]/).pop().replace(/\.[^.]+$/, "") + `_geo${S.geo.shapes}.svg`; a.click(); };
  geoInfo();
}
function geoInfo() { const i = $("geoInfo"); if (!i || !S.geo.res) return;
  i.textContent = `${S.geo.res.shapes} shapes · ` + Object.entries(S.geo.res.counts).map(([k, v]) => `${k} ${v}`).join(", ") + ` · ${S.geo.res.seconds} s`; }
let tGeo = null, geoSeq = 0;
function geoChanged() { try { localStorage.setItem("fs_geo", JSON.stringify({ ...S.geo, svg: null, res: null })); } catch (e) {}
  clearTimeout(tGeo); tGeo = setTimeout(geometrize, 300); }
async function geometrize() {
  if (S.cur < 0 || S.app !== "geo") return;
  const path = S.images[S.cur], seq = ++geoSeq;
  $("geoOrig").src = "/api/image?path=" + encodeURIComponent(path);
  $("geoBusy").textContent = "geometrizing…"; busy(true, "rebuilding objects from shapes…");
  try {
    const r = await api("/api/geometrize", { path, settings: S.values.general, shapes: S.geo.shapes, kinds: S.geo.kinds,
                                               lines: S.geo.lines, min_area: S.geo.min_area });
    if (seq !== geoSeq) return;
    S.geo.svg = r.svg; S.geo.res = r;
    $("geoOut").innerHTML = r.svg;
    const sv = $("geoOut").querySelector("svg"); if (sv) { sv.removeAttribute("width"); sv.removeAttribute("height"); sv.setAttribute("preserveAspectRatio", "xMidYMid meet"); }
    $("geoCap").textContent = `shapes (${r.shapes})`; $("geoBusy").textContent = ""; geoInfo();
  } catch (e) { $("geoBusy").textContent = "failed: " + e.message; toast("geometrize failed: " + e.message); }
  finally { busy(false); }
}
for (const [g, rows] of Object.entries(SETTINGS)) { S.values[g] = {}; for (const r of rows) S.values[g][r[0]] = r[5]; }
try { const saved = JSON.parse(localStorage.getItem("fs_settings") || "null");
      if (saved) { for (const g in saved.values) Object.assign(S.values[g] || {}, saved.values[g]); Object.assign(S.enabled, saved.enabled || {}); } } catch (e) {}

const $ = id => document.getElementById(id);
const api = async (url, body) => {
  const r = await fetch(url, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const j = await r.json(); if (j.error) throw new Error(j.error); return j;
};
function tabs(el, items, cur, onPick, extraClass = "") {
  el.innerHTML = "";
  for (const [key, label, color] of items) {
    const t = document.createElement("div"); t.className = "tab " + extraClass + (cur(key) ? " on" : "");
    t.textContent = label; if (color && cur(key)) t.style.background = color, t.style.borderColor = color;
    t.onclick = () => onPick(key); el.appendChild(t);
  }
}
function status(t) { $("status").textContent = t; }
let busyN = 0, busyTimer = null;
function busy(on, text) {
  busyN = Math.max(0, busyN + (on ? 1 : -1));
  if (on) $("busyText").textContent = text || "processing…";
  $("busy").classList.toggle("on", busyN > 0);
}
let toastTimer = null;
function toast(t) { const e = $("toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => e.classList.remove("on"), 2500); }
function countKinds(d) { const c = {}; for (const s of (d ? d.shapes : [])) c[s.kind] = (c[s.kind] || 0) + 1; return c; }

// ---------- header ----------
function drawHeader() {
  tabs($("modeTabs"), [["inspect", "Inspect"], ["missed", "Mark missed"]], k => S.mode === k, k => { S.mode = k; drawHeader(); });
  $("missedTabs").style.display = S.mode === "missed" ? "flex" : "none";
  tabs($("missedTabs"), SHAPE_KINDS.map(k => [k, k, KCOL(k)]), k => S.missedKind === k, k => { S.missedKind = k; drawHeader(); }, "kind");
  tabs($("kindTabs"), KINDS.map(k => [k, k === "model" ? "model map" : k, KCOL(k)]), k => S.show[k],
       k => { S.show[k] = !S.show[k]; drawHeader(); if (k === "model" && S.show.model) detect(false, false); else drawShapes(); }, "kind");
  tabs($("modelTabs"), [["on", "on"], ["off", "off"]], k => (k === "on") === S.useModel,
       k => { S.useModel = k === "on"; drawHeader(); detect(false, true); });
  if (S.data && !S.data.classifier_available) $("modelTabs").title = "no model: put region_classifier.onnx in flatshapes/models and pip install onnxruntime";
  if (S.data) {

    $("fbCrumbs").appendChild(c); if (i < parts.length - 1) $("fbCrumbs").append(" › "); });
  const extra = [["~", "Home", FB.home], ...FB.drives.map(d => [d, d, d]), ...FB.recent.map(r => ["r:" + r, "↺ " + r.split(/[\\/]/).filter(Boolean).slice(-2).join(sep), r])];

// ---------- viewer ----------
const NS = "http://www.w3.org/2000/svg";

  const sc = Math.max(w / v.width, h / v.height); S.vb = [-(v.width * sc - w) / 2, -(v.height * sc - h) / 2, v.width * sc, v.height * sc]; setVB(); }

const svg = $("svg");
svg.addEventListener("wheel", ev => { if (!S.vb) return; ev.preventDefault(); const [x, y] = toImg(ev), f = ev.deltaY > 0 ? 1.2 : 1 / 1.2;
  S.vb = [x - (x - S.vb[0]) * f, y - (y - S.vb[1]) * f, S.vb[2] * f, S.vb[3] * f]; setVB(); }, { passive: false });

svg.addEventListener("mousedown", ev => { drag = { x: ev.clientX, y: ev.clientY, vb: S.vb.slice(), moved: false }; });

  const dx = (ev.clientX - drag.x) / r.width * S.vb[2], dy = (ev.clientY - drag.y) / r.height * S.vb[3];
  if (Math.abs(ev.clientX - drag.x) + Math.abs(ev.clientY - drag.y) > 4) drag.moved = true;
  if (drag.moved) { S.vb = [drag.vb[0] - dx, drag.vb[1] - dy, S.vb[2], S.vb[3]]; setVB(); } });

    const col = r.decision === "unsure" ? "#9a9ca3" : (r.cls === "none" ? "#ff5a5a" : KCOL(r.cls));
    const d = "M" + r.pts.map(p => p.join(",")).join("L") + "Z";
    const e = el("path", { d, fill: col + (r.decision === "unsure" ? "33" : "55"), stroke: col, "stroke-width": lw * 0.6,
                           "stroke-dasharray": r.decision === "skip" ? `${3 * px()} ${2 * px()}` : "" }, g);
    e.style.pointerEvents = "none";

      el("text", { x: it.cx, y: it.cy + 4 * px(), "font-size": 12 * px(), "text-anchor": "middle", fill: KCOL("motif"),

  }

    el("rect", { x: x0, y: y0, width: x1 - x0, height: y1 - y0, fill: "none", stroke: "#fff8", "stroke-width": px() }, g); }
}

async function clickAt(ev) {
  if (!S.data) return;
  const [x, y] = toImg(ev);
  if (S.mode === "missed") {
    S.verd.missed.push({ kind: S.missedKind, x: +x.toFixed(1), y: +y.toFixed(1) }); saveVerdicts(); drawShapes(); return;

  const c = S.verd.marks.filter(m => m.verdict === "correct").length, w = S.verd.marks.length - c;
  sec.innerHTML = `<h3>This image</h3><div><span class="pass">${c} correct</span> · <span class="fail">${w} wrong</span> · ${S.verd.missed.length} missed</div>
    <div class="muted" style="margin:6px 0">Missed shapes: switch to <b>Mark missed</b>, pick the kind, click where it is. Click a missed marker in the list to remove it.</div>
    <div id="missedList"></div>`;
  const ml = sec.querySelector("#missedList");
  S.verd.missed.forEach((m, i) => { const d = document.createElement("div"); d.className = "file";
    d.innerHTML = `<span style="color:${KCOL(m.kind)}">missed ${m.kind}</span> at (${m.x.toFixed(0)}, ${m.y.toFixed(0)}) <span class="muted">— remove</span>`;
    d.onclick = () => { S.verd.missed.splice(i, 1); saveVerdicts(); drawShapes(); drawVerdicts(); }; ml.appendChild(d); });
  const sec2 = document.createElement("section"); elp.appendChild(sec2); sec2.innerHTML = `<h3>All images</h3><div class="muted">loading…</div>`;
  try { const t = await api("/api/summary");
    sec2.innerHTML = `<h3>All images (${t.images} with verdicts)</h3><table><tr><th>kind</th><th>correct</th><th>wrong</th><th>missed</th><th>precision</th></tr>
      ${Object.entries(t.by_kind).map(([k, v]) => `<tr><td style="color:${KCOL(k)}">${k}</td><td>${v.correct}</td><td>${v.wrong}</td><td>${v.missed}</td>
        <td>${v.correct + v.wrong ? (100 * v.correct / (v.correct + v.wrong)).toFixed(0) + "%" : "–"}</td></tr>`).join("")}</table>`;
  } catch (e) { sec2.innerHTML = `<div class="fail">${e.message}</div>`; }
}

// ---------- image loading ----------
async function openImage(i) {
  if (i < 0 || i >= S.images.length) return;
  if (S.app === "geo") { S.cur = i; S.data = null; drawFiles(); geometrize(); return; }
  S.cur = i; S.sel = null; S.inspect = null; drawFiles();
  const path = S.images[i];
  svg.innerHTML = ""; status("loading " + path);
  try { S.verd = await api("/api/verdicts?path=" + encodeURIComponent(path)); } catch (e) { S.verd = { marks: [], missed: [] }; }
  const img = el("image", { href: "/api/image?path=" + encodeURIComponent(path), x: 0, y: 0 }, svg);
  img.style.imageRendering = "pixelated";
  await detect(true);
  img.setAttribute("width", S.data.width); img.setAttribute("height", S.data.height);
  img.style.opacity = 0.6;
}
let detectSeq = 0;
async function detect(refit, fromSettings) {
  if (S.cur < 0) return;
  const seq = ++detectSeq; status("detecting…"); const t0 = performance.now();
  const before = S.data && !refit ? countKinds(S.data) : null;
  busy(true, refit ? "loading and detecting…" : "recalculating with new settings…");
  try { const d = await api("/api/detect", reqBase()); if (seq !== detectSeq) return; S.data = d; }
  catch (e) { status("detect failed: " + e.message); toast("detect failed: " + e.message); return; }
  finally { busy(false); }
  const secs = ((performance.now() - t0) / 1000).toFixed(1);
  status(`${S.images[S.cur]} · ${S.data.width}×${S.data.height} · ${secs} s · updated ${new Date().toLocaleTimeString()}`);
  if (S.data.fit_seconds != null) status($("status").textContent + ` · shapes ${S.data.fit_seconds} s, model ${S.data.classifier_used ? "on" : (S.data.classifier_available ? "off" : "not installed")}`);
  if (fromSettings && before) {
    const after = countKinds(S.data), diff = KINDS.filter(k => (before[k] || 0) !== (after[k] || 0))
      .map(k => `${k} ${before[k] || 0}→${after[k] || 0}`);
    toast(`Recalculated in ${secs} s · ` + (diff.length ? diff.join(", ") : "same result with these settings"));
  }
  if (refit || !S.vb) fit(); else drawShapes();
  drawHeader(); if (S.panel !== "settings") drawPanels();
}

window.addEventListener("keydown", ev => {
  if (ev.target.tagName === "INPUT" || ev.target.tagName === "TEXTAREA") return;
  if ($("fb").classList.contains("on")) { if (ev.key === "Escape") fbShow(false); return; }
  if (ev.key === "c" || ev.key === "C") mark("correct");
  else if (ev.key === "x" || ev.key === "X") mark("wrong");
  else if (ev.key === "Delete" || ev.key === "Backspace") mark(null);
  else if (ev.key === "ArrowRight") openImage(S.cur + 1);
  else if (ev.key === "ArrowLeft") openImage(S.cur - 1);
  else if (ev.key === "f" || ev.key === "F") fit();
  else if (ev.key === "Escape") { S.sel = null; S.inspect = null; drawShapes(); drawPanels(); }
});
window.addEventListener("resize", () => S.vb && fit());

(async () => {
  drawHeader(); drawPanels(); drawApp();
  try { const r = await api("/api/list"); applyList(r); if (!r.root) fbShow(true); }
  catch (e) { status("server error: " + e.message); }
})();
</script>
</body>
